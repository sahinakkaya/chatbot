services:
  chatbot:
    build:
      context: ../../src/
      dockerfile: ./chatbot/Dockerfile
    image: chatbot
    container_name: chatbot
    env_file:
      - ../../src/chatbot/.env.example
      - path: ../../src/chatbot/.env
        required: false
    ports:
      - "8080:8000"
    volumes:
      - logs:/var/log/nova-prime
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app-network

volumes:
  logs:

networks:
  app-network:
    driver: bridge
