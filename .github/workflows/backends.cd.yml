name: Backend CD
on:
  workflow_dispatch:
  # schedule:
  #   - cron:  '38 19 * * *' # run the cron job every day at 19.38 
  push:
    branches:
      - "main"
    tags-ignore:
      - "**"
    paths:
      - "src/**"
      - ".github/workflows/**"
      - ".github/actions/**"
env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push-chatbot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push chatbot
        uses: ./.github/actions/build-push-image
        with:
          service-name: chatbot
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/chatbot
